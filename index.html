<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="KNOWLEDGE - Phân loại bài viết theo thể loại & đọc chi tiết">
    <title>KNOWLEDGE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Organic Accents -->
    <div class="bg-shapes">
        <div class="shape shape-top-right"></div>
        <div class="shape shape-bottom-left"></div>
    </div>

    <div class="app-container">
        <!-- ========== TRANG 1: TRANG CHỦ THỂ LOẠI (MATCH SCREENSHOT 100%) ========== -->
        <div id="view-home" class="page-view active">
            <header class="hero-center">
                <h1 class="hero-giant-title">
                    Best<br>
                    <span class="highlight-dark">Knowledge</span><br>
                    in <span class="highlight-sage">2026</span>
                </h1>

                <div class="subtitle-divider">
                    <span class="div-line"></span>
                    <span class="div-text">Simple picks by category</span>
                    <span class="div-line"></span>
                </div>
            </header>

            <!-- Grid nút Thể loại (Pill Buttons Grid) -->
            <div class="categories-pill-grid" id="categories-grid">
                <!-- Rendered dynamically by JS -->
            </div>

            <!-- Global Action Bar -->
            <div class="home-bottom-actions">
                <button class="btn-create-post" id="btn-create-post">
                    <span class="btn-icon-plus">+</span>
                    <span>Create new post</span>
                </button>
            </div>
        </div>

        <!-- ========== TRANG 2: DANH SÁCH BÀI VIẾT THEO THỂ LOẠI ========== -->
        <div id="view-category-articles" class="page-view">
            <header class="nav-bar-header">
                <button class="btn-nav-back" id="btn-back-home">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
                    <span>Home</span>
                </button>
                <div class="category-header-title clickable" id="cat-header-title-btn" title="Click to edit or delete category">
                    <span class="cat-icon-badge" id="cat-badge-emoji">📖</span>
                    <h2 id="cat-title-name">Category Title</h2>
                    <span class="cat-edit-indicator" title="Click to manage category">⚙️</span>
                </div>
                <div class="category-header-actions">
                    <button class="btn-plus-action" id="btn-add-article-in-cat" title="Create new post">
                        <span class="plus-icon">+</span>
                    </button>
                </div>
            </header>

            <div class="search-category-row">
                <div class="search-input-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-cat-input" placeholder="Search posts in this category...">
                </div>
            </div>

            <main class="articles-grid" id="articles-grid">
                <!-- Articles rendered by JS -->
            </main>

            <div class="empty-articles-state" id="empty-articles" style="display:none;">
                <div class="empty-emoji">📄</div>
                <h3>No posts in this category yet</h3>
                <p>Create your first post now!</p>
                <button class="btn-primary" id="btn-add-first-article">+ Create new post</button>
            </div>
        </div>

        <!-- ========== TRANG 3: CHI TIẾT BÀI VIẾT ĐẦY ĐỦ (FULL READER VIEW) ========== -->
        <div id="view-article-detail" class="page-view">
            <header class="nav-bar-header">
                <button class="btn-nav-back" id="btn-back-cat-articles">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
                    <span>Back</span>
                </button>
                <div class="article-actions-top">
                    <button class="btn-action-icon" id="btn-edit-current-article" title="Chỉnh sửa bài viết">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
                        <span>Sửa</span>
                    </button>
                    <button class="btn-action-icon btn-danger" id="btn-delete-current-article" title="Xóa bài viết">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                        <span>Xóa</span>
                    </button>
                </div>
            </header>

            <article class="reader-container">
                <div class="reader-meta-bar">
                    <span class="cat-pill-badge" id="reader-cat-badge">Thể loại</span>
                    <span class="reader-date" id="reader-date">10/08/2026</span>
                </div>

                <h1 class="reader-title" id="reader-title">Tiêu đề bài viết đầy đủ</h1>

                <div class="reader-tags-row" id="reader-tags">
                    <!-- Tag chips rendered here -->
                </div>

                <div class="reader-content-body" id="reader-content">
                    <!-- Full Article Body Rendered here -->
                </div>
            </article>
        </div>
    </div>

    <!-- ========== MODAL: TẠO / SỬA BÀI VIẾT MỚI (VỚI TỰ CHỌN / THÊM THỂ LOẠI) ========== -->
    <div id="modal-article" class="modal-overlay">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h2 id="modal-article-title">Tạo bài viết mới</h2>
                <button class="modal-close" data-close="modal-article">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="post-title">Tiêu đề bài viết</label>
                    <input type="text" id="post-title" placeholder="VD: 10 Công cụ AI hỗ trợ lập trình 2026..." maxlength="120">
                </div>

                <!-- Chọn thể loại có sẵn HOẶC Thêm thể loại mới -->
                <div class="form-group">
                    <label>Thể loại chủ đề</label>
                    <div class="category-selection-box">
                        <select id="post-category-select">
                            <!-- Options populated by JS -->
                        </select>
                        <button type="button" class="btn-inline-secondary" id="btn-toggle-new-cat">
                            + Thể loại mới
                        </button>
                    </div>
                </div>

                <!-- Thể loại mới Form Input (Ẩn mặc định) -->
                <div class="new-category-input-group" id="new-cat-box" style="display:none;">
                    <div class="form-group">
                        <label for="new-cat-name">Tên thể loại mới</label>
                        <input type="text" id="new-cat-name" placeholder="VD: Lập trình, AI Tools, Sách hay...">
                    </div>
                    <div class="form-group">
                        <label>Biểu tượng thể loại</label>
                        <div class="emoji-picker" id="emoji-picker">
                            <button type="button" class="emoji-option selected" data-emoji="🖊️">🖊️</button>
                            <button type="button" class="emoji-option" data-emoji="🔍">🔍</button>
                            <button type="button" class="emoji-option" data-emoji="🏔️">🏔️</button>
                            <button type="button" class="emoji-option" data-emoji="▷">▷</button>
                            <button type="button" class="emoji-option" data-emoji="🎛️">🎛️</button>
                            <button type="button" class="emoji-option" data-emoji="🖌️">🖌️</button>
                            <button type="button" class="emoji-option" data-emoji="⚙️">⚙️</button>
                            <button type="button" class="emoji-option" data-emoji="💡">💡</button>
                            <button type="button" class="emoji-option" data-emoji="💻">💻</button>
                            <button type="button" class="emoji-option" data-emoji="📖">📖</button>
                            <button type="button" class="emoji-option" data-emoji="🚀">🚀</button>
                        </div>
                        <input type="hidden" id="new-cat-emoji" value="🖊️">
                    </div>
                </div>

                <div class="form-group">
                    <label for="post-content">Nội dung bài viết đầy đủ</label>
                    <textarea id="post-content" rows="10" placeholder="Viết toàn bộ nội dung của bạn ở đây...&#10;&#10;Hỗ trợ Markdown:&#10;**in đậm**, *in nghiêng*&#10;- Danh sách bài viết&#10;`code`"></textarea>
                </div>

                <div class="form-group">
                    <label for="post-tags">Thẻ tag (phân cách bởi dấu phẩy)</label>
                    <input type="text" id="post-tags" placeholder="VD: ai, tools, writing, coding">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" data-close="modal-article">Hủy</button>
                <button class="btn-primary" id="btn-save-article">Lưu bài viết</button>
            </div>
        </div>
    </div>

    <!-- ========== MODAL: XÁC NHẬN XÓA ========== -->
    <div id="modal-confirm" class="modal-overlay">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h2>Xác nhận xóa</h2>
                <button class="modal-close" data-close="modal-confirm">&times;</button>
            </div>
            <div class="modal-body">
                <p id="confirm-message" class="confirm-text">Bạn có chắc chắn muốn xóa bài viết này?</p>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" data-close="modal-confirm">Hủy</button>
                <button class="btn-danger-fill" id="btn-confirm-delete">Xóa</button>
            </div>
        </div>
    </div>

    <!-- ========== MODAL: CHỈNH SỬA THỂ LOẠI / CHỦ ĐỀ ========== -->
    <div id="modal-edit-cat" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2>Chỉnh sửa chủ đề</h2>
                <button class="modal-close" data-close="modal-edit-cat">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="edit-cat-name">Tên chủ đề</label>
                    <input type="text" id="edit-cat-name" placeholder="VD: Writing, Lập trình, Design..." maxlength="50">
                </div>
                <div class="form-group">
                    <label>Biểu tượng chủ đề</label>
                    <div class="emoji-picker" id="edit-cat-emoji-picker">
                        <button type="button" class="emoji-option" data-emoji="🖊️">🖊️</button>
                        <button type="button" class="emoji-option" data-emoji="🔍">🔍</button>
                        <button type="button" class="emoji-option" data-emoji="🏔️">🏔️</button>
                        <button type="button" class="emoji-option" data-emoji="▷">▷</button>
                        <button type="button" class="emoji-option" data-emoji="🎛️">🎛️</button>
                        <button type="button" class="emoji-option" data-emoji="🖌️">🖌️</button>
                        <button type="button" class="emoji-option" data-emoji="⚙️">⚙️</button>
                        <button type="button" class="emoji-option" data-emoji="💡">💡</button>
                        <button type="button" class="emoji-option" data-emoji="💻">💻</button>
                        <button type="button" class="emoji-option" data-emoji="📖">📖</button>
                        <button type="button" class="emoji-option" data-emoji="🚀">🚀</button>
                        <button type="button" class="emoji-option" data-emoji="🧠">🧠</button>
                        <button type="button" class="emoji-option" data-emoji="🎨">🎨</button>
                    </div>
                    <input type="hidden" id="edit-cat-emoji-value" value="📖">
                </div>
            </div>
            <div class="modal-footer" style="justify-content:space-between;">
                <button class="btn-danger-fill" id="btn-delete-cat-in-modal">Xóa chủ đề</button>
                <div style="display:flex;gap:0.5rem;">
                    <button class="btn-secondary" data-close="modal-edit-cat">Hủy</button>
                    <button class="btn-primary" id="btn-save-edit-cat">Lưu thay đổi</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== MODAL: THAO TÁC THỂ LOẠI (EDIT & DELETE) ========== -->
    <div id="modal-cat-manage" class="modal-overlay">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h2 id="cat-manage-title">Tùy chọn chủ đề</h2>
                <button class="modal-close" data-close="modal-cat-manage">&times;</button>
            </div>
            <div class="modal-body" style="display:flex;flex-direction:column;gap:0.75rem;">
                <button class="btn-option-choice" id="btn-choice-edit-cat">
                    <span class="choice-icon">✏️</span>
                    <div class="choice-text">
                        <span class="choice-title">Chỉnh sửa chủ đề</span>
                        <span class="choice-desc">Đổi tên hoặc biểu tượng chủ đề</span>
                    </div>
                </button>
                <button class="btn-option-choice danger" id="btn-choice-delete-cat">
                    <span class="choice-icon">🗑️</span>
                    <div class="choice-text">
                        <span class="choice-title">Xóa chủ đề</span>
                        <span class="choice-desc">Xóa chủ đề này và tất cả bài viết thuộc về nó</span>
                    </div>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
